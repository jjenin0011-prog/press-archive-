<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البطاقة الصحفية الرقمية - جنى أبو بكر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #070a12;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(165deg, #0f172a 0%, #1e293b 100%);
            border-radius: 24px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(37, 99, 235, 0.25);
            overflow: hidden;
            position: relative;
        }

        .card-header {
            background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .press-tag {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 8.5pt;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .card-id-num {
            font-size: 8pt;
            color: #93c5fd;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .profile-section {
            padding: 28px 20px 20px;
            text-align: center;
            position: relative;
        }

        .avatar-box {
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            padding: 3px;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28pt;
            color: #60a5fa;
            font-weight: 900;
        }

        .user-name {
            font-size: 16pt;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .user-title {
            display: inline-block;
            font-size: 9pt;
            color: #60a5fa;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 14px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .info-list {
            padding: 0 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s ease;
        }

        .info-item:hover {
            border-color: rgba(59, 130, 246, 0.4);
        }

        .info-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14pt;
            flex-shrink: 0;
        }

        .info-text {
            flex: 1;
            text-align: right;
            overflow: hidden;
        }

        .info-label {
            font-size: 7.5pt;
            color: #94a3b8;
            margin-bottom: 2px;
            display: block;
        }

        .info-value {
            font-size: 9.5pt;
            font-weight: 700;
            color: #f1f5f9;
            text-decoration: none;
            word-break: break-all;
        }

        .info-value:hover {
            color: #60a5fa;
        }

        .card-footer {
            background: rgba(15, 23, 42, 0.9);
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .barcode-strip {
            display: flex;
            gap: 3px;
            align-items: center;
            height: 24px;
            opacity: 0.7;
        }

        .bar {
            background-color: #94a3b8;
            height: 100%;
            border-radius: 1px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 8pt;
            color: #34d399;
            font-weight: 700;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- الشريط العلوي الصحفي -->
        <div class="card-header">
            <span class="press-tag">PRESS • بطاقة إعلامية</span>
            <span class="card-id-num">ID: MEDIA-2026</span>
        </div>

        <!-- قسم الصورة الشخصية والاسم -->
        <div class="profile-section">
            <div class="avatar-box">
                <div class="avatar-inner">ج</div>
            </div>
            <h1 class="user-name">جنى أبو بكر</h1>
            <span class="user-title">Media Technology Student</span>
        </div>

        <!-- قائمة بيانات التواصل -->
        <div class="info-list">
            <div class="info-item">
                <div class="info-icon">✉</div>
                <div class="info-text">
                    <span class="info-label">البريد الإلكتروني الرسمي</span>
                    <a href="mailto:jana.abubaker0@gmail.com" class="info-value">jana.abubaker0@gmail.com</a>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">📱</div>
                <div class="info-text">
                    <span class="info-label">رقم التواصل</span>
                    <a href="tel:0568690236" class="info-value">0568690236</a>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">📷</div>
                <div class="info-text">
                    <span class="info-label">حساب الإنستغرام</span>
                    <a href="https://instagram.com/jenin_media0" target="_blank" class="info-value">@jenin_media0</a>
                </div>
            </div>
        </div>

        <!-- أسفل البطاقة -->
        <div class="card-footer">
            <div class="status-badge">
                <span class="dot"></span>
                <span>بطاقة معتمدة</span>
            </div>
            
            <!-- باركود رمزي للإعلام -->
            <div class="barcode-strip">
                <div class="bar" style="width: 2px;"></div>
                <div class="bar" style="width: 4px;"></div>
                <div class="bar" style="width: 1px;"></div>
                <div class="bar" style="width: 3px;"></div>
                <div class="bar" style="width: 2px;"></div>
                <div class="bar" style="width: 5px;"></div>
                <div class="bar" style="width: 1px;"></div>
                <div class="bar" style="width: 3px;"></div>
            </div>
        </div>
    </div>

</body>
</html>
