<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الصحافة الميداني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-deep: #0a0c10;
            --surface: #13161d;
            --press-blue: #0055ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        .phone-mockup {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-deep);
            border: 8px solid #1e293b;
            border-radius: 30px;
            overflow: hidden;
            min-height: 850px;
            display: flex;
            flex-direction: column;
        }

        /* هيدر احترافي */
        .hero-section {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(180deg, #1e293b 0%, var(--bg-deep) 100%);
            border-bottom: 3px solid var(--press-blue);
        }
        .hero-section h1 {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--press-blue);
            margin-bottom: 8px;
        }
        .hero-section p { color: var(--text-muted); font-size: 13px; }

        /* فلاتر رسمية */
        .filters-container {
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            gap: 8px;
            background: var(--bg-deep);
        }
        .filter-btn {
            background: var(--surface);
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 2px;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .filter-btn.active {
            background: var(--press-blue);
            color: white;
            border-color: var(--press-blue);
        }

        /* بطاقات سجلات أرشيفية */
        .content-area { padding: 10px; }
        .journalist-card {
            margin-bottom: 20px;
            background: var(--surface);
            padding: 20px;
            border-top: 4px solid var(--press-blue);
            border-radius: 2px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
        .journalist-info h3 { font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .status-badge {
            font-size: 9px;
            font-weight: bold;
            padding: 3px 8px;
            background: rgba(0, 85, 255, 0.1);
            color: var(--press-blue);
            border: 1px solid var(--press-blue);
        }
        .card-body { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }
        
        .pdf-btn {
            background: var(--press-blue);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-mockup">
        <div class="hero-section">
            <h1>Press Archive</h1>
            <p>سجل توثيق الانتهاكات الميدانية</p>
        </div>

        <div class="filters-container">
            <button class="filter-btn active" onclick="filterJournalists('all', this)">الكل</button>
            <button class="filter-btn" onclick="filterJournalists('martyr', this)">شهداء</button>
            <button class="filter-btn" onclick="filterJournalists('imprisoned', this)">معتقلون</button>
            <button class="filter-btn" onclick="filterJournalists('wounded', this)">مصابون</button>
        </div>

        <div class="content-area" id="journalistsContainer"></div>
    </div>

    <script src="journalists.js"></script>
    <script>
        function renderJournalists(filter = 'all') {
            const container = document.getElementById('journalistsContainer');
            container.innerHTML = '';
            const filteredData = filter === 'all' ? journalistsData : journalistsData.filter(i => i.category === filter);

            filteredData.forEach(person => {
                const cardId = `id-${person.id}`;
                const card = document.createElement('div');
                card.className = 'journalist-card';
                card.id = cardId;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="journalist-info">
                            <h3>${person.name}</h3>
                            <span style="font-size:11px; color:#64748b;">${person.institution}</span>
                        </div>
                        <span class="status-badge">${person.category.toUpperCase()}</span>
                    </div>
                    <div class="card-body"><p>${person.details}</p></div>
                    <button class="pdf-btn" onclick="exportToPDF('${cardId}', '${person.name}')">تصدير سجل PDF</button>
                `;
                container.appendChild(card);
            });
        }

        function filterJournalists(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderJournalists(cat);
        }

        function exportToPDF(id, name) {
            const el = document.getElementById(id);
            html2pdf().from(el).set({ filename: `Press_Record_${name}.pdf` }).save();
        }

        window.onload = () => renderJournalists('all');
    </script>
</body>
</html>
