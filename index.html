<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الصحافة - توثيق الحقيقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #07090e;
            --bg-card: #10141d;
            --border-subtle: #222736;
            --accent-blue: #0055ff;
            --accent-glow: rgba(0, 85, 255, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .phone-mockup {
            width: 100%;
            max-width: 440px;
            /* تأثير التوهج في الخلفية مطابق تماماً لتصميمك المفضل ولكن باللون الأزرق الصحفي */
            background: radial-gradient(circle at top, rgba(0, 85, 255, 0.12) 0%, rgba(7, 9, 14, 0) 70%), var(--bg-deep);
            border-radius: 35px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 85, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 850px;
            position: relative;
        }

        /* الهيدر والمسافات مطابقة لتوزيع الصورة */
        header {
            padding: 24px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-title-group h1 {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-main);
        }
        .header-title-group h1 span {
            color: var(--accent-blue);
        }

        .top-action-btn {
            background: rgba(0, 85, 255, 0.1);
            border: 1px solid rgba(0, 85, 255, 0.3);
            color: #60a5fa;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* ترويسة المشروع الوصفية */
        .project-intro {
            padding: 20px 20px 10px;
        }
        .project-tag {
            display: inline-block;
            background: rgba(0, 85, 255, 0.15);
            color: #60a5fa;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 85, 255, 0.3);
            margin-bottom: 8px;
        }
        .project-intro h2 {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .project-intro p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* شريط البحث */
        .search-container {
            padding: 10px 20px;
        }
        .search-box {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box input {
            background: none;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 13px;
        }
        .search-box input::placeholder { color: #64748b; }

        /* شريط الفلاتر */
        .filters-container {
            display: flex;
            gap: 8px;
            padding: 5px 20px 15px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filters-container::-webkit-scrollbar { display: none; }

        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background-color: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-glow);
            font-weight: 700;
        }

        /* منطقة البطاقات */
        .content-area {
            flex: 1;
            padding: 5px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* تصميم البطاقة الفاخرة المطابقة للنموذج */
        .journalist-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .journalist-card:hover {
            border-color: rgba(0, 85, 255, 0.4);
            transform: translateY(-2px);
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .category-badge-small {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }
        .badge-martyr { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-imprisoned { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-wounded { background: rgba(0, 85, 255, 0.15); color: #60a5fa; border: 1px solid rgba(0, 85, 255, 0.3); }

        .journalist-info h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }
        .journalist-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* زر التفاعل السفلي داخل البطاقة تماماً كالصورة */
        .card-action-btn {
            background: rgba(0, 85, 255, 0.1);
            border: 1px solid rgba(0, 85, 255, 0.3);
            color: #60a5fa;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .card-action-btn:hover {
            background: var(--accent-blue);
            color: #fff;
        }

        /* نافذة التفاصيل المنبثقة (Modal) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-image-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #1e2536;
            margin: 0 auto;
            overflow: hidden;
            border: 2px solid var(--accent-blue);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-header-info { text-align: center; }
        .modal-header-info h2 { font-size: 18px; color: var(--text-main); margin-bottom: 4px; }
        .modal-header-info span { font-size: 12px; color: var(--text-muted); }

        .modal-body-text {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.7;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 10px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="phone-mockup">
        <!-- الهيدر العلوي المماثل -->
        <header>
            <div class="header-title-group">
                <h1>أرشيف <span>الصحافة</span></h1>
            </div>
            <button class="top-action-btn">
                <i class="fa-solid fa-shield-halved"></i> درع الصحافة
            </button>
        </header>

        <!-- الترويسة الرئيسية والوصف -->
        <div class="project-intro">
            <span class="project-tag">مشروع توثيق إعلامي</span>
            <h2>كلمتنا ليست أرقاماً</h2>
            <p>«اضغط على بطاقة أي صحفي لقراءة حكايته الكاملة.»</p>
        </div>

        <!-- شريط البحث -->
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" id="searchInput" placeholder="ابحث باسم الصحفي أو لقبه..." oninput="filterRecords()">
            </div>
        </div>

        <!-- فلاتر الأقسام -->
        <div class="filters-container">
            <button class="filter-btn active" onclick="setCategory('all', this)">الكل</button>
            <button class="filter-btn" onclick="setCategory('martyr', this)">الشهداء</button>
            <button class="filter-btn" onclick="setCategory('imprisoned', this)">المعتقلون</button>
            <button class="filter-btn" onclick="setCategory('wounded', this)">المصابون</button>
        </div>

        <!-- مساحة عرض السجلات -->
        <div class="content-area" id="recordsContainer"></div>

        <!-- نافذة التفاصيل المنبثقة (Modal) -->
        <div class="modal-overlay" id="detailModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="modal-image-container">
                    <img id="modalImg" src="" alt="صورة الصحفي" onerror="this.src='https://via.placeholder.com/90?text=Press'">
                </div>
                <div class="modal-header-info">
                    <h2 id="modalName">اسم الصحفي</h2>
                    <span id="modalInstitution">المؤسسة</span>
                </div>
                <div class="modal-body-text" id="modalDetails">
                    التفاصيل الكاملة...
                </div>
            </div>
        </div>

        <footer>
            PRESS ARCHIVE SYSTEM &copy; 2026
        </footer>
    </div>

    <script src="journalists.js"></script>
    <script>
        let currentCategory = 'all';

        function renderRecords() {
            const container = document.getElementById('recordsContainer');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            let filtered = journalistsData.filter(item => {
                const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery) || item.institution.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:13px;">لا توجد سجلات مطابقة للبحث</div>';
                return;
            }

            filtered.forEach(person => {
                let badgeClass = '';
                let labelText = '';
                if(person.category === 'martyr') { badgeClass = 'badge-martyr'; labelText = 'شهيد صحفي'; }
                else if(person.category === 'imprisoned') { badgeClass = 'badge-imprisoned'; labelText = 'معتقل'; }
                else if(person.category === 'wounded') { badgeClass = 'badge-wounded'; labelText = 'مصاب'; }

                const card = document.createElement('div');
                card.className = 'journalist-card';
                card.onclick = () => openModal(person);
                
                card.innerHTML = `
                    <div class="card-top-row">
                        <div class="journalist-info">
                            <h3>${person.name}</h3>
                            <span>${person.institution}</span>
                        </div>
                        <span class="category-badge-small ${badgeClass}">${labelText}</span>
                    </div>
                    <button class="card-action-btn">
                        <i class="fa-solid fa-book-open"></i> اضغط لقراءة التفاصيل الكاملة
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function openModal(person) {
            document.getElementById('modalName').innerText = person.name;
            document.getElementById('modalInstitution').innerText = person.institution;
            document.getElementById('modalDetails').innerText = person.details;
            document.getElementById('modalImg').src = person.image || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=150';
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderRecords();
        }

        function filterRecords() {
            renderRecords();
        }

        window.onload = () => renderRecords();
    </script>
</body>
</html>
