<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الصحفيين - توثيق الحقيقة</title>
    <!-- خطوط جوجل العربية الفاخرة -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة لتصدير الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-deep: #0b0b0e;
            --bg-card: #141419;
            --bg-card-hover: #1c1c24;
            --accent-orange: #d97706;
            --accent-orange-glow: rgba(217, 119, 6, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var--text-main;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        /* حاوية الهاتف المحاكاة (Mobile Mockup Container) */
        .phone-mockup {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-deep);
            border: 12px solid #18181b;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(217, 119, 6, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 850px;
            position: relative;
        }

        /* شريط الحالة الوهمي للهاتف */
        .phone-status-bar {
            background-color: #18181b;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        /* رأس الهيدر الخاص بالتطبيق */
        header {
            padding: 24px 20px 16px;
            text-align: center;
            background: linear-gradient(180deg, #18181b 0%, var(--bg-deep) 100%);
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        header h1 span {
            color: var(--accent-orange);
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* أزرار الفلترة */
        .filters-container {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            background-color: var(--bg-deep);
            scrollbar-width: none; /* إخفاء شريط التمرير */
        }
        .filters-container::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-orange);
            color: var(--text-main);
        }

        .filter-btn.active {
            background-color: var(--accent-orange);
            color: #ffffff;
            border-color: var(--accent-orange);
            box-shadow: 0 0 12px var(--accent-orange-glow);
        }

        /* منطقة عرض البطاقات */
        .content-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* تصميم بطاقة الصحفي */
        .journalist-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .journalist-card:hover {
            border-color: rgba(217, 119, 6, 0.4);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .journalist-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .journalist-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* شارة الحالة (Badge) */
        .status-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .status-martyr { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-imprisoned { background-color: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .status-wounded { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }

        .card-body {
            font-size: 13px;
            color: #d1d5db;
            line-height: 1.5;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date-info {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* زر تحميل السجل PDF */
        .pdf-btn {
            background-color: transparent;
            color: var(--accent-orange);
            border: 1px solid var(--accent-orange);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .pdf-btn:hover {
            background-color: var(--accent-orange);
            color: #ffffff;
            box-shadow: 0 0 10px var(--accent-orange-glow);
        }

        /* تذييل التطبيق */
        footer {
            text-align: center;
            padding: 12px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-deep);
        }
    </style>
</head>
<body>

    <div class="phone-mockup">
        <!-- شريط الحالة -->
        <div class="phone-status-bar">
            <span>2:26</span>
            <span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> 100%</span>
        </div>

        <!-- الهيدر -->
        <header>
            <h1>أرشيف <span>الصحفيين</span></h1>
            <p>توثيق الحقيقة ورصد الانتهاكات</p>
        </header>

        <!-- أزرار الفلترة -->
        <div class="filters-container">
            <button class="filter-btn active" onclick="filterJournalists('all', this)">الكل</button>
            <button class="filter-btn" onclick="filterJournalists('martyr', this)">شهداء الصحافة</button>
            <button class="filter-btn" onclick="filterJournalists('imprisoned', this)">معتقلون</button>
            <button class="filter-btn" onclick="filterJournalists('wounded', this)">جرحى ومصابون</button>
        </div>

        <!-- مساحة عرض السجلات -->
        <div class="content-area" id="journalistsContainer">
            <!-- يتم تعبئة البيانات برمجياً من ملف journalists.js -->
        </div>

        <!-- تذييل الهاتف -->
        <footer>
            منصة رقمية مستقلة لتوثيق الصحفيين
        </footer>
    </div>

    <!-- استدعاء ملف البيانات الخارجي -->
    <script src="journalists.js"></script>
    
    <script>
        // دالة عرض البيانات وتوليد البطاقات
        function renderJournalists(filter = 'all') {
            const container = document.getElementById('journalistsContainer');
            container.innerHTML = '';

            const filteredData = filter === 'all' 
                ? journalistsData 
                : journalistsData.filter(item => item.category === filter);

            if (filteredData.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:40px;">لا توجد سجلات مطابقة حالياً</div>';
                return;
            }

            filteredData.forEach(person => {
                let badgeClass = '';
                let statusText = '';
                
                if (person.category === 'martyr') {
                    badgeClass = 'status-martyr';
                    statusText = 'شهيد';
                } else if (person.category === 'imprisoned') {
                    badgeClass = 'status-imprisoned';
                    statusText = 'معتقل';
                } else if (person.category === 'wounded') {
                    badgeClass = 'status-wounded';
                    statusText = 'مصاب';
                }

                const cardId = `journalist-${person.id}`;
                
                const card = document.createElement('div');
                card.className = 'journalist-card';
                card.id = cardId;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="journalist-info">
                            <h3>${person.name}</h3>
                            <span>${person.institution}</span>
                        </div>
                        <span class="status-badge ${badgeClass}">${statusText}</span>
                    </div>
                    <div class="card-body">
                        <p>${person.details}</p>
                    </div>
                    <div class="card-footer">
                        <span class="date-info"><i class="fa-regular fa-calendar"></i> ${person.date}</span>
                        <button class="pdf-btn" onclick="exportToPDF('${cardId}', '${person.name}')">
                            <i class="fa-solid fa-file-arrow-down"></i> تحميل PDF
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // تفاعل أزرار الفلترة
        function filterJournalists(category, buttonElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            renderJournalists(category);
        }

        // وظيفة تصدير السجل الفردي كملف PDF
        function exportToPDF(elementId, personName) {
            const element = document.getElementById(elementId);
            const opt = {
                margin:       10,
                filename:     `سجل_الصحفي_${personName.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#141419' },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        // التشغيل الأولي عند تحميل الصفحة
        window.onload = () => {
            renderJournalists('all');
        };
    </script>
</body>
</html>
