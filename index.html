<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الصحفيين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(18, 24, 38, 0.7);
            --bg-card-hover: rgba(26, 35, 54, 0.85);
            --border-glow: rgba(0, 102, 255, 0.35);
            --border-subtle: rgba(255, 255, 255, 0.08);
            
            --accent-blue: #0066ff;
            --accent-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --red-glow: #ef4444;
            --yellow-glow: #eab308;
            --blue-glow: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            direction: rtl;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 102, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
        }

        .phone-mockup {
            width: 100%;
            max-width: 430px;
            background: rgba(13, 18, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 102, 255, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 840px;
            position: relative;
        }

        /* ===== الهيدر العلوي ===== */
        header {
            padding: 22px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
            z-index: 50;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.4);
        }

        .header-title-group h1 {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .top-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .top-icon-btn:hover {
            background: rgba(0, 102, 255, 0.15);
            color: #fff;
            border-color: var(--accent-blue);
            transform: rotate(90deg);
        }

        /* ===== القائمة المنسدلة ===== */
        .dropdown-menu {
            position: absolute;
            top: 75px;
            left: 20px;
            background: rgba(15, 22, 35, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            width: 290px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-12px) scale(0.95);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 1000;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .dropdown-section {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 12px;
        }
        .dropdown-section:last-child { border-bottom: none; }
        .dropdown-section h4 {
            color: var(--accent-cyan);
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .cities-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 4px;
        }
        .city-tag {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .city-tag:hover {
            background: rgba(0, 102, 255, 0.2);
            color: #fff;
            transform: translateY(-1px);
        }
        .city-tag.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        /* ===== ترويسة الصفحة ===== */
        .project-intro { padding: 20px 20px 10px; }
        .project-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 102, 255, 0.1);
            color: var(--accent-cyan);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 102, 255, 0.2);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .project-intro h2 { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 4px; }
        .project-intro p { font-size: 12px; color: var(--text-muted); }

        /* ===== شريط البحث ===== */
        .search-container { padding: 10px 20px; }
        .search-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .search-box:focus-within {
            border-color: var(--accent-blue);
            background: rgba(0, 102, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.2);
        }
        .search-box input {
            background: none;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 13px;
        }

        /* ===== فلاتر التبويب ===== */
        .filters-container {
            display: flex;
            gap: 8px;
            padding: 5px 20px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filters-container::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }
        .filter-btn:active { transform: scale(0.95); }
        .filter-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.35);
        }

        .active-filter-indicator {
            padding: 0 20px 8px;
            font-size: 11px;
            color: var(--accent-cyan);
            font-weight: 700;
            min-height: 22px;
        }

        /* ===== البطاقات والأنيميشن ===== */
        .content-area {
            flex: 1;
            padding: 5px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .journalist-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            cursor: pointer;
            animation: cardFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
        }

        .journalist-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-glow);
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .journalist-info h3 {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .meta-tags {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .meta-tags span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .category-pill {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 30px;
            font-weight: 700;
        }
        .pill-martyr { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .pill-imprisoned { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .pill-wounded { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 11px;
            color: var(--text-muted);
        }

        .read-more-link {
            color: var(--accent-cyan);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s ease;
        }

        .journalist-card:hover .read-more-link {
            transform: translateX(-4px);
        }

        /* ===== النافذة المنبثقة (Modal) ===== */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(180deg, #131a29 0%, #0b0f19 100%);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            transform: scale(0.88) translateY(15px);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 16px; left: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; justifyContent: center; align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .modal-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            transform: rotate(90deg);
        }

        .modal-header-hero { text-align: center; }

        .modal-avatar-wrapper {
            width: 76px;
            height: 76px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            padding: 2px;
        }

        .modal-avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0d131f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: var(--accent-cyan);
        }

        .modal-header-hero h2 {
            font-size: 19px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
        }

        .info-box label {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .info-box span {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .modal-story-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-story-box h4 {
            font-size: 12px;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modal-story-box p {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.7;
            max-height: 160px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="phone-mockup">
        <!-- الهيدر -->
        <header>
            <div class="header-title-group">
                <div class="logo-icon">
                    <i class="fa-solid fa-newspaper"></i>
                </div>
                <h1>عين الحقيقة</h1>
            </div>
            <button class="top-icon-btn" id="menuBtn" onclick="toggleDropdown(event)">
                <i class="fa-solid fa-sliders"></i>
            </button>

            <!-- القائمة المنسدلة -->
            <div class="dropdown-menu" id="dropdownMenu">
                <div class="dropdown-section">
                    <h4>تصفية حسب المدينة</h4>
                    <div class="cities-grid">
                        <span class="city-tag active" onclick="setCityFilter('الكل', this)">الكل</span>
                        <span class="city-tag" onclick="setCityFilter('غزة', this)">غزة</span>
                        <span class="city-tag" onclick="setCityFilter('جنين', this)">جنين</span>
                        <span class="city-tag" onclick="setCityFilter('الخليل', this)">الخليل</span>
                        <span class="city-tag" onclick="setCityFilter('نابلس', this)">نابلس</span>
                        <span class="city-tag" onclick="setCityFilter('رام الله', this)">رام الله</span>
                        <span class="city-tag" onclick="setCityFilter('القدس', this)">القدس</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- الترويسة -->
        <div class="project-intro">
            <span class="project-tag"><i class="fa-solid fa-shield-halved"></i> توثيق الانتهاكات</span>
            <h2>سجل الصحفيين</h2>
            <p>سجل وثائقي لحماية الحقيقة وحفظ شهادات الصحفيين.</p>
        </div>

        <!-- شريط البحث -->
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" id="searchInput" placeholder="ابحث باسم الصحفي، المؤسسة، أو المدينة..." oninput="renderRecords()">
            </div>
        </div>

        <!-- الفلاتر -->
        <div class="filters-container">
            <button class="filter-btn active" onclick="setCategoryFilter('all', this)">الجميع</button>
            <button class="filter-btn" onclick="setCategoryFilter('martyr', this)">الشهداء</button>
            <button class="filter-btn" onclick="setCategoryFilter('imprisoned', this)">الأسرى</button>
            <button class="filter-btn" onclick="setCategoryFilter('wounded', this)">الجرحى</button>
        </div>

        <div class="active-filter-indicator" id="activeFilterNotice"></div>

        <!-- مساحة عرض البطاقات -->
        <div class="content-area" id="recordsContainer"></div>
    </div>

    <!-- النافذة المنبثقة -->
    <div class="modal-overlay" id="detailModal" onclick="closeModalOnOutside(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="modal-header-hero">
                <div class="modal-avatar-wrapper">
                    <div class="modal-avatar-inner">
                        <i class="fa-solid fa-user-ninja"></i>
                    </div>
                </div>
                <h2 id="modalName">---</h2>
                <span id="modalCategoryBadge" class="category-pill">---</span>
            </div>
            
            <div class="modal-info-grid">
                <div class="info-box">
                    <label>المؤسسة الإعلامية</label>
                    <span id="modalInstitution">---</span>
                </div>
                <div class="info-box">
                    <label>المدينة / الموقع</label>
                    <span id="modalCity">---</span>
                </div>
                <div class="info-box" style="grid-column: span 2;">
                    <label>تاريخ التوثيق / الحادثة</label>
                    <span id="modalDate">---</span>
                </div>
            </div>

            <div class="modal-story-box">
                <h4><i class="fa-solid fa-file-lines"></i> التفاصيل والشهادة</h4>
                <p id="modalDetails">---</p>
            </div>
        </div>
    </div>

    <!-- البيانات والبرمجة -->
    <script>
        // بيانات تجريبية (قم باستبدالها ببياناتك أو ربطها بملف البيانات الخاص بك)
        const journalistsData = [
            { name: "أحمد أبو حسين", category: "martyr", institution: "قناة الشعب", city: "غزة", date: "2018-04-25", details: "استشهد متأثراً بإصابته أثناء تغطيته الصحفية الميدانية شرق غزة." },
            { name: "احمد الناعوق", category: "wounded", institution: "شبكة عين", city: "غزة", date: "2023-11-12", details: "أصيب أثناء تغطيته الأحداث القائمة في القطاع." },
            { name: "محمد القيق", category: "imprisoned", institution: "صحفي حر", city: "رام الله", date: "2021-01-15", details: "اعتقل إدارياً لعدة أشهر بسبب نشاطه والتغطية الإعلامية." },
            { name: "شيرين أبو عاقلة", category: "martyr", institution: "قناة الجزيرة", city: "جنين", date: "2022-05-11", details: "استشهدت برصاصة أثناء تغطيتها لاقتحام مخيم جنين." },
            { name: "إبراهيم ملحم", category: "wounded", institution: "تلفزيون فلسطين", city: "الخليل", date: "2020-08-04", details: "أصيب بقنبلة غاز بشكل مباشر أثناء التغطية." }
        ];

        let currentCategory = 'all';
        let currentCity = 'الكل';

        // دالة لتوحيد أشكال الحروف العربية (إزالة الهمزات، التشكيل، والتاء المربوطة)
        function normalizeArabicText(text) {
            if (!text) return '';
            return text
                .toLowerCase()
                .replace(/[أإآآ]/g, 'ا') // تحويل أشكال الهمزة إلى ألف عادية
                .replace(/ة/g, 'ه')       // تحويل التاء المربوطة إلى هاء
                .replace(/ى/g, 'ي')       // تحويل الألف المقصورة إلى ياء
                .replace(/[\u064B-\u0652]/g, '') // إزالة التشكيل
                .trim();
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function renderRecords(customData = null) {
            const container = document.getElementById('recordsContainer');
            const searchInput = document.getElementById('searchInput');
            
            // توحيد نص البحث المدخل من المستخدم
            const rawSearchQuery = searchInput ? searchInput.value : '';
            const cleanQuery = normalizeArabicText(rawSearchQuery);
            
            container.innerHTML = '';

            let list = customData || ((typeof journalistsData !== 'undefined') ? journalistsData : []);

            let filtered = list.filter(item => {
                if (!item) return false;

                const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchesCity = currentCity === 'الكل' || (item.city && item.city === currentCity);
                
                // توحيد بيانات الصحفي قبل المقارنة
                const cleanName = normalizeArabicText(item.name);
                const cleanInstitution = normalizeArabicText(item.institution);
                const cleanCity = normalizeArabicText(item.city);

                const matchesSearch = cleanQuery === '' || 
                    cleanName.includes(cleanQuery) || 
                    cleanInstitution.includes(cleanQuery) || 
                    cleanCity.includes(cleanQuery);

                return matchesCategory && matchesCity && matchesSearch;
            });

            let noticeText = '';
            if (currentCity !== 'الكل') noticeText += `تصفية حسب المدينة: ${currentCity}`;
            document.getElementById('activeFilterNotice').innerText = noticeText;

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:13px; animation: cardFadeIn 0.3s ease forwards;">لا توجد سجلات مطابقة للبحث</div>';
                return;
            }

            // عرض البطاقات مع التأثير الحركي المرحلي
            filtered.forEach((person, index) => {
                let badgeClass = '';
                let labelText = '';

                if(person.category === 'martyr') { 
                    badgeClass = 'pill-martyr'; 
                    labelText = 'شهيد صحفي';
                } else if(person.category === 'imprisoned') { 
                    badgeClass = 'pill-imprisoned'; 
                    labelText = 'أسير صحفي';
                } else if(person.category === 'wounded') { 
                    badgeClass = 'pill-wounded'; 
                    labelText = 'جريح ومصاب';
                }

                const card = document.createElement('div');
                card.className = 'journalist-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => openModal(person);
                
                const displayCity = person.city ? person.city : 'غير محدد';
                const displayDate = person.date ? person.date : '---';

                card.innerHTML = `
                    <div class="card-top">
                        <div class="journalist-info">
                            <h3>${person.name}</h3>
                            <div class="meta-tags">
                                <span><i class="fa-solid fa-building"></i> ${person.institution}</span>
                                <span><i class="fa-solid fa-location-dot"></i> ${displayCity}</span>
                            </div>
                        </div>
                        <span class="category-pill ${badgeClass}">${labelText}</span>
                    </div>
                    <div class="card-bottom">
                        <span><i class="fa-regular fa-calendar-alt"></i> ${displayDate}</span>
                        <span class="read-more-link">التفاصيل <i class="fa-solid fa-chevron-left"></i></span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(person) {
            document.getElementById('modalName').innerText = person.name;
            document.getElementById('modalCity').innerText = person.city || 'غير محدد';
            document.getElementById('modalInstitution').innerText = person.institution || 'غير محدد';
            document.getElementById('modalDate').innerText = person.date || 'غير محدد';
            document.getElementById('modalDetails').innerText = person.details;

            const badgeEl = document.getElementById('modalCategoryBadge');
            if(person.category === 'martyr') {
                badgeEl.className = 'category-pill pill-martyr';
                badgeEl.innerText = 'شهيد صحفي';
            } else if(person.category === 'imprisoned') {
                badgeEl.className = 'category-pill pill-imprisoned';
                badgeEl.innerText = 'أسير صحفي';
            } else if(person.category === 'wounded') {
                badgeEl.className = 'category-pill pill-wounded';
                badgeEl.innerText = 'جريح ومصاب';
            }

            document.getElementById('detailModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function closeModalOnOutside(event) {
            if (event.target.id === 'detailModal') {
                closeModal();
            }
        }

        function setCategoryFilter(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderRecords();
        }

        function setCityFilter(city, el) {
            currentCity = city;
            document.querySelectorAll('.city-tag').forEach(t => t.classList.remove('active'));
            if (el) el.classList.add('active');
            const menu = document.getElementById('dropdownMenu');
            if (menu) menu.classList.remove('show');
            renderRecords();
        }

        function toggleDropdown(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            if (menu) menu.classList.toggle('show');
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('dropdownMenu');
            const menuBtn = document.getElementById('menuBtn');
            if (menu && menu.classList.contains('show')) {
                if (!menu.contains(event.target) && !menuBtn.contains(event.target)) {
                    menu.classList.remove('show');
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof journalistsData !== 'undefined' && journalistsData.length > 0) {
                const randomizedData = shuffleArray(journalistsData);
                renderRecords(randomizedData);
            } else {
                renderRecords();
            }
        });
    </script>
</body>
</html>
